<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Math Markdown Reader</title>
    
    <!-- 版本钉死（2026-10-07）：原来 marked / marked-highlight 都没写版本号。marked 从 v16 起不再提供
         marked.min.js，CDN 是「回退到最后一个还有这个文件的版本」才给出 15.0.12 的，属于凑巧能用。
         这里钉的就是当时实际在跑的版本（marked 15.0.12、marked-highlight 2.2.4），行为不变。 -->
    <script src="https://cdn.jsdelivr.net/npm/marked@15.0.12/marked.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked-highlight@2.2.4/lib/index.umd.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.4.10/dist/purify.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mermaid@10.9.3/dist/mermaid.min.js"></script>

    <script>
        // 只放配置，不在这里直接加载 tex-chtml.js 本体——MathJax 体积不小，
        // 真正的脚本改成"文档里检测到 $ 数学语法才按需加载"，纯文字/代码笔记打开更快
        window.MathJax = {
            tex: {
                inlineMath: [['\\(', '\\)']],
                displayMath: [['\\[', '\\]']],
                processEscapes: true
            },
            options: {
                ignoreHtmlClass: '.*',
                processHtmlClass: 'math-display|math-inline'
            },
            startup: { typeset: false }
        };
    </script>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link id="hljs-style" rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github.min.css">
    <link id="md-style" rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/github-markdown-css/5.5.0/github-markdown-light.min.css">
    
    <style>
        /* ================= 1. Apple 风格色彩与底层锁死 ================= */
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        
        :root {
            --apple-blue: #007AFF; --apple-green: #34C759; --apple-red: #FF3B30; --apple-gray: #8E8E93;
            --bg-base: #F2F2F7; --bg-surface: #FFFFFF; --text-main: #000000; --text-secondary: #6C6C70;
            --border-color: #E5E5EA; --header-bg: rgba(255, 255, 255, 0.85); --sidebar-bg: #F8F8F8;
            --header-height: 55px;
            --sync-highlight-bg: #fff59d;
        }
        
        [data-theme="dark"] {
            --apple-blue: #0A84FF; --apple-green: #30D158; --apple-red: #FF453A;
            --bg-base: #000000; --bg-surface: #1C1C1E; --text-main: #FFFFFF; --text-secondary: #EBEBF5;
            --border-color: #38383A; --header-bg: rgba(28, 28, 30, 0.85); --sidebar-bg: #151515;
            --sync-highlight-bg: #6b5b00;
        }
        
        html, body { height: 100%; width: 100%; overflow: hidden; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg-base); color: var(--text-main);
            display: flex; flex-direction: column;
        }

        /* ================= 2. 动态顶栏 ================= */
        header {
            flex-shrink: 0; height: calc(var(--header-height) + env(safe-area-inset-top));
            padding-top: env(safe-area-inset-top); background: var(--header-bg);
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border-color); display: flex; align-items: center;
            justify-content: space-between; padding: 0 16px; z-index: 100;
        }

        .header-section { display: flex; align-items: center; gap: 6px; flex: 1; min-width: 0; }
        .header-center { flex: 2; justify-content: center; text-align: center; min-width: 0; padding: 0 12px; }
        .header-right { justify-content: flex-end; gap: 8px; flex: 1; min-width: 0; }

        .icon-btn { background: none; border: none; color: var(--apple-blue); flex-shrink: 0; font-size: 1.3rem; padding: 8px; border-radius: 8px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: opacity 0.2s; }
        .icon-btn:active { opacity: 0.5; }
        
        .text-btn { background: none; border: none; color: var(--apple-blue); flex-shrink: 0; font-size: 16px; font-weight: 500; padding: 6px 10px; border-radius: 6px; cursor: pointer; display: flex; align-items: center; gap: 4px; transition: background 0.2s; }
        .text-btn:active { background: rgba(128,128,128,0.2); }
        .text-btn.danger { color: var(--apple-red); }
        .text-btn.primary { background: var(--apple-blue); color: white; font-weight: 600; }
        .text-btn.primary:active { background: var(--apple-blue); opacity: 0.7; }

        .logo-text { font-weight: 700; font-size: 1.1rem; color: var(--apple-blue); cursor: pointer; flex-shrink: 0; }
        
        .file-title-display { font-weight: 600; font-size: 1rem; color: var(--text-main); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; display: block; cursor: pointer; transition: opacity 0.2s; touch-action: manipulation; -webkit-user-select: none; user-select: none; }
        .file-title-display:active { opacity: 0.4; }

        .hidden { display: none !important; }

        /* ================= 3. 布局与绝对滚动层 ================= */
        .app-container { flex-grow: 1; position: relative; display: flex; overflow: hidden; }

        .toc-sidebar { width: 250px; background: var(--sidebar-bg); border-right: 1px solid var(--border-color); overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 20px 0; transition: transform 0.3s ease, width 0.3s ease; flex-shrink: 0; z-index: 10; }
        @media (min-width: 768px) { .toc-sidebar.collapsed { width: 0; border: none; padding: 0; overflow: hidden; } }
        .toc-title { font-size: 12px; font-weight: 600; color: var(--text-secondary); text-transform: uppercase; padding: 0 20px 10px; letter-spacing: 0.5px; }
        .toc-link { display: block; padding: 8px 20px; color: var(--text-main); text-decoration: none; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; border-left: 3px solid transparent; }
        .toc-link:active { background: rgba(128,128,128,0.1); }
        .toc-h1 { font-weight: 600; } .toc-h2 { padding-left: 30px; } .toc-h3 { padding-left: 40px; font-size: 13px; color: var(--text-secondary); }

        .main-content { flex-grow: 1; position: relative; background: var(--bg-surface); overflow: hidden; }
        .view-layer { position: absolute; top: 0; left: 0; right: 0; bottom: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; background: var(--bg-surface); }

        /* ================= 4. 核心视图样式 ================= */
        .view-home { background: var(--bg-base); display: flex; align-items: center; justify-content: center; padding: 20px; }
        .upload-card { background: var(--bg-surface); border-radius: 16px; padding: 40px; text-align: center; border: 1px solid var(--border-color); width: 100%; max-width: 400px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        .upload-icon { font-size: 4rem; color: var(--apple-blue); margin-bottom: 20px; }
        .upload-title { font-size: 1.2rem; font-weight: 500; margin-bottom: 24px; color: var(--text-secondary); }
        .btn-upload-lg { background: var(--apple-green); color: white; padding: 12px 24px; border-radius: 8px; font-weight: 600; font-size: 15px; display: inline-flex; align-items: center; gap: 8px; cursor: pointer; transition: transform 0.1s; }
        .btn-upload-lg:active { transform: scale(0.96); }

        .view-read { padding: 30px 20px; padding-bottom: calc(30px + env(safe-area-inset-bottom)); }
        .markdown-container { max-width: 900px; margin: 0 auto; }
        .markdown-body { background: transparent !important; color: inherit !important; font-family: inherit !important; }

        .markdown-body pre { position: relative; }
        .markdown-body .code-block-wrapper { position: relative; }
        .copy-code-btn { position: absolute; top: 8px; right: 8px; background: rgba(128, 128, 128, 0.2); backdrop-filter: blur(5px); -webkit-backdrop-filter: blur(5px); border: none; border-radius: 4px; padding: 4px 8px; font-size: 12px; color: var(--apple-blue); cursor: pointer; opacity: 0.6; transition: opacity 0.2s; z-index: 2; }
        .copy-code-btn:hover { opacity: 1; }

        .markdown-body .mermaid-wrapper { position: relative; }
        .markdown-body .mermaid { overflow-x: auto; padding: 8px 0; }
        .markdown-body .mermaid svg { max-width: 100%; }
        /* 编辑预览里每个顶层块前面的空行号标记（光标同步用，见 annotateBlocks）。零高度、不占位，
           上下两块的外边距照样穿过它折叠。github-markdown-css 用 .markdown-body>:first-child 去掉第一块的
           上边距，第一个子元素变成标记后要补到它后面那块上。 */
        .kb-block-mark { display: block; height: 0; margin: 0; padding: 0; }
        .markdown-body > .kb-block-mark:first-child + * { margin-top: 0 !important; }

        /* MathJax 保护层样式 */
        .math-display { display: block; margin: 1em 0; overflow-x: auto; }
        .math-inline { display: inline-block; }
        /* MathJax 是异步渲染的：脚本加载+排版需要时间，这段时间内先把原始的 \(...\) 源码藏起来，
           避免用户先看到一闪而过的 LaTeX 源文本，等 typesetPromise 完成后由 JS 去掉这个 class 再显现 */
        .markdown-body.math-pending .math-inline, .markdown-body.math-pending .math-display { visibility: hidden; }

        .view-edit { display: flex; flex-direction: column; overflow: hidden; }
        .edit-pane, .preview-pane { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 20px; padding-bottom: calc(20px + env(safe-area-inset-bottom)); }
        .edit-pane { background: var(--bg-surface); border-bottom: 1px solid var(--border-color); }
        .preview-pane { background: var(--bg-base); }
        #editor-textarea { width: 100%; height: 100%; resize: none; border: none; outline: none; background: transparent; color: var(--text-main); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif; font-size: 16px; line-height: 1.6; padding: 5px; }

        /* 编辑光标定位同步：光标移到源码某一行时，预览区对应的那一块短暂闪一下，
           提示"就是这一块"。高亮目标不一定是 editor-preview 的直接子元素——粒度细
           化之后也可能是列表项 li 或表格行 tr，所以不能用 ">" 直接子选择器。 */
        #editor-preview .sync-highlight { animation: sync-highlight-flash 0.9s ease-out; border-radius: 6px; }
        @keyframes sync-highlight-flash { from { background: var(--sync-highlight-bg); } to { background: transparent; } }

        @media (min-width: 768px) { .view-edit { flex-direction: row; } .edit-pane { border-bottom: none; border-right: 1px solid var(--border-color); } }
        @media (max-width: 767px) { 
            .toc-sidebar { position: fixed; top: 0; left: -280px; width: 280px; height: 100%; z-index: 201; box-shadow: 2px 0 20px rgba(0,0,0,0.2); transition: transform 0.3s cubic-bezier(0.25, 0.8, 0.25, 1); } 
            .toc-sidebar.mobile-open { transform: translateX(280px); } 
            .desktop-only { display: none !important; } 
        }

        /* ================= 5. 左侧历史/文件夹抽屉 ================= */
        .overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.4); z-index: 200; display: none; opacity: 0; transition: opacity 0.3s; }
        .drawer { position: fixed; top: 0; left: 0; height: 100vh; width: 280px; background: var(--bg-surface); z-index: 201; transform: translateX(-100%); transition: transform 0.3s cubic-bezier(0.25, 0.8, 0.25, 1); display: flex; flex-direction: column; }
        .drawer-header { padding: 20px; border-bottom: 1px solid var(--border-color); margin-top: env(safe-area-inset-top); font-weight: 600; font-size: 1.2rem; display: flex; justify-content: space-between; align-items: center; }
        .drawer-content { overflow-y: auto; flex-grow: 1; padding-bottom: env(safe-area-inset-bottom); }
        
        .menu-action { padding: 12px 20px; display: flex; align-items: center; gap: 12px; color: var(--apple-blue); font-weight: 500; cursor: pointer; border-bottom: 1px solid var(--border-color); }
        .menu-action:active { background: rgba(128,128,128,0.1); }
        
        /* 文件夹及拖拽样式 */
        .folder-group { border-bottom: 1px solid var(--border-color); transition: border 0.2s; }
        .folder-group.dragging { opacity: 0.4; background: var(--bg-base); }
        .folder-group.drag-over { border-top: 2px solid var(--apple-blue); }
        
        .folder-header { padding: 12px 20px; display: flex; align-items: center; justify-content: space-between; background: var(--bg-base); cursor: pointer; user-select: none; }
        .folder-header:active { background: var(--border-color); }
        .folder-info { display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: 14px; color: var(--text-main); }
        .folder-icon { color: var(--apple-gray); width: 16px; text-align: center; }
        .folder-actions { display: flex; gap: 10px; color: var(--text-secondary); }
        .folder-btn { background: none; border: none; color: inherit; cursor: pointer; font-size: 14px; padding: 4px; transition: color 0.2s; }
        .folder-btn:active { color: var(--apple-blue); }
        
        .folder-files { display: none; background: var(--bg-surface); }
        .folder-group.open .folder-files { display: block; }
        .folder-group.open .fa-chevron-right { transform: rotate(90deg); }
        .fa-chevron-right { transition: transform 0.2s; font-size: 12px; color: var(--text-secondary); }

        /* 文件项样式 */
        .history-item { padding: 12px 16px 12px 36px; display: flex; align-items: center; position: relative; border-bottom: 1px solid var(--border-color); }
        .history-item:last-child { border-bottom: none; }
        .history-info { flex-grow: 1; display: flex; flex-direction: column; gap: 4px; overflow: hidden; cursor: pointer; padding-right: 10px; }
        .history-title { font-size: 14px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: flex; align-items: center; color: var(--text-main); }
        .history-date { font-size: 11px; color: var(--text-secondary); }
        .history-more-btn { background: none; border: none; color: var(--text-secondary); padding: 8px 12px; cursor: pointer; border-radius: 6px; font-size: 16px; }
        .history-more-btn:active, .history-more-btn.active { background: rgba(128,128,128,0.15); color: var(--text-main); }
        
        /* 悬浮菜单 & Tooltip */
        .mobile-action-menu { position: fixed; bottom: calc(10px + env(safe-area-inset-bottom)); left: 10px; right: 10px; background: var(--header-bg); backdrop-filter: blur(25px); -webkit-backdrop-filter: blur(25px); border: 1px solid var(--border-color); border-radius: 16px; box-shadow: 0 -8px 30px rgba(0,0,0,0.12); z-index: 300; display: none; flex-direction: column; padding: 8px 0; max-height: 80vh; overflow-y: auto; }
        .mobile-action-menu.show { display: flex; animation: slideInUp 0.3s cubic-bezier(0.25, 0.8, 0.25, 1); }
        .action-item { padding: 16px 20px; display: flex; align-items: center; gap: 15px; cursor: pointer; color: var(--apple-blue); font-weight: 500; font-size: 17px; border-bottom: 1px solid rgba(128,128,128,0.1); }
        .action-item:last-child { border-bottom: none; }
        .action-item:active { background: rgba(128,128,128,0.15); }
        .action-item.danger { color: var(--apple-red); }
        .action-item.success { color: var(--apple-green); }
        .action-item.title { font-size: 12px; color: var(--text-secondary); justify-content: center; text-transform: uppercase; letter-spacing: 0.5px; padding: 10px; cursor: default; border-bottom: none; }
        .action-item.title:active { background: none; }
        .action-item i { width: 20px; text-align: center; }
        @keyframes slideInUp { from { transform: translateY(100%); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

        .title-tooltip { position: fixed; top: calc(var(--header-height) + env(safe-area-inset-top) + 10px); left: 50%; transform: translateX(-50%); background: var(--header-bg); backdrop-filter: blur(25px); -webkit-backdrop-filter: blur(25px); color: var(--text-main); padding: 10px 18px; border-radius: 12px; box-shadow: 0 8px 30px rgba(0,0,0,0.15); border: 1px solid var(--border-color); z-index: 1000; max-width: 90vw; word-break: break-all; font-weight: 500; font-size: 14px; text-align: center; opacity: 0; pointer-events: none; transition: opacity 0.3s ease; }
        .title-tooltip.show { opacity: 1; pointer-events: auto; }

        .fab-toc { position: fixed; bottom: calc(20px + env(safe-area-inset-bottom)); right: 20px; width: 50px; height: 50px; border-radius: 25px; background: var(--apple-blue); color: white; border: none; box-shadow: 0 4px 15px rgba(0, 122, 255, 0.4); font-size: 20px; z-index: 150; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: transform 0.2s, opacity 0.2s, background 0.2s; }
        .fab-toc:active { transform: scale(0.9); background: #005ecb; }

    </style>
</head>
<body data-theme="light">

    <header id="main-header">
        <div class="header-section">
            <button class="icon-btn" id="btn-hamburger" aria-label="菜单"><i class="fas fa-bars"></i></button>
            <button class="text-btn hidden" id="btn-back"><i class="fas fa-chevron-left"></i> 返回</button>
            <button class="text-btn danger hidden" id="btn-edit-cancel">取消</button>
            <div class="logo-text" id="header-logo"><i class="fab fa-markdown"></i> MD Reader</div>
        </div>
        <div class="header-section header-center">
            <div class="file-title-display hidden" id="header-title" title="点击查看完整名称"></div>
        </div>
        <div class="header-section header-right">
            <button class="icon-btn hidden" id="btn-read-more" title="更多操作"><i class="fas fa-ellipsis-h"></i></button>
            <button class="icon-btn hidden" id="btn-edit-more" title="编辑选项"><i class="fas fa-ellipsis-h"></i></button>
            <button class="icon-btn hidden" id="btn-read-copy" title="复制全文"><i class="fas fa-copy"></i></button>
            <button class="text-btn primary hidden" id="btn-read-edit"><i class="fas fa-edit"></i> 编辑</button>
            <button class="text-btn hidden" id="btn-home-sample"><i class="fas fa-file-code"></i> 示例</button>
            <button class="text-btn hidden" id="btn-edit-reset">重置</button>
            <button class="text-btn primary hidden" id="btn-edit-save">保存</button>
            <button class="icon-btn" id="btn-theme" aria-label="切换主题"><i class="fas fa-moon"></i></button>
        </div>
    </header>

    <div class="app-container">
        <div class="toc-sidebar collapsed" id="toc-sidebar">
            <div class="toc-title">目录 Contents</div>
            <div id="toc-content"></div>
        </div>

        <div class="main-content">
            <div class="view-layer view-home" id="view-home">
                <div class="upload-card">
                    <i class="fas fa-file-alt upload-icon"></i>
                    <div class="upload-title">数学 Markdown 阅读器</div>
                    <label class="btn-upload-lg">
                        <i class="fas fa-upload"></i> 打开 MD 文件
                        <input type="file" id="file-upload-home" hidden>
                    </label>
                </div>
            </div>
  
            <div class="view-layer view-read hidden" id="view-read">
                <div class="markdown-container">
                    <div class="markdown-body" id="reader-content"></div>
                </div>
            </div>
        
            <div class="view-layer view-edit hidden" id="view-edit">
                <div class="edit-pane">
                    <textarea id="editor-textarea" placeholder="在此输入 Markdown..."></textarea>
                </div>
                <div class="preview-pane">
                    <div class="markdown-body" id="editor-preview"></div>
                </div>
            </div>
        </div>
    </div>

    <button class="fab-toc hidden mobile-only" id="btn-fab-toc" title="打开打开目录"><i class="fas fa-list-ul"></i></button>

    <div class="overlay" id="overlay"></div>
    <div class="drawer" id="drawer">
        <div class="drawer-header">
            <span>我的文件</span>
            <div style="display: flex; gap: 4px;">
                <button class="icon-btn" id="btn-sort" style="font-size: 16px; padding: 4px;" title="按时间排序"><i class="fas fa-sort-amount-down"></i></button>
                <button class="icon-btn" id="btn-new-folder" style="font-size: 16px; padding: 4px;" title="新建文件夹"><i class="fas fa-folder-plus"></i></button>
            </div>
        </div>
        <div class="drawer-content">
            <div class="menu-action" id="menu-new" style="color: var(--apple-green);"><i class="fas fa-plus-circle"></i> 新建空白文档</div>
            <label class="menu-action">
                <i class="fas fa-file-upload"></i> 导入本地文件
                <input type="file" id="file-upload-drawer" hidden>
            </label>
            <div id="history-list" style="margin-top: 10px;"></div>
        </div>
    </div>

    <div class="overlay" id="toc-overlay" style="z-index: 200;"></div>
    <div class="overlay" id="action-menu-overlay" style="z-index: 250;"></div>
    <div class="mobile-action-menu" id="action-menu">
        <div class="action-menu-content" id="action-menu-items"></div>
    </div>
    <div id="title-tooltip" class="title-tooltip"></div>

    <script>
        const { markedHighlight } = globalThis.markedHighlight;

        // 判断一段内容更像正文而不是数学：花括号里的东西（\text{其他}、\frac{甲}{乙}）
        // 是合法的公式内容，由内向外逐层剥掉之后，外面若还剩中文/全角标点，那就是正文。
        // 金额误配对（"$5 和 $"）和被转义的方括号（"\[这是方括号\]"）都靠这条识别。
        const looksLikeProse = (s) => {
            let bare = s;
            for (let i = 0; i < 5 && /\{[^{}]*\}/.test(bare); i++) bare = bare.replace(/\{[^{}]*\}/g, '');
            return /[一-鿿　-〿＀-￯]/.test(bare);
        };

        // 【终极修复点】解除了前后空格的严格限制，完美兼容你的手写习惯
        const mathExtension = {
            name: 'math',
            level: 'inline',
            // 除了 $，还要盯住 \( 和 \[ ——它们是 LaTeX 原生定界符，也是下面 MathJax
            // 配置里唯一认得的两种；不在这里截住，markdown 会把反斜杠当转义吃掉。
            start(src) {
                const idx = [src.indexOf('$'), src.indexOf('\\('), src.indexOf('\\[')].filter(i => i >= 0);
                return idx.length ? Math.min.apply(null, idx) : -1;
            },
            tokenizer(src, tokens) {
                const blockRule = /^\$\$([\s\S]+?)\$\$/;
                // 去除了原本严苛的 (?!\s) 和 (?<!\s)，允许公式内部前后带空格
                const inlineRule = /^\$((?:\\.|[^\$\n])+?)\$/;
                // LaTeX 原生定界符。marked 会把 \( 解析成转义的左括号并吃掉反斜杠，
                // 等 MathJax 来找定界符时已经没了，所以必须在这一层先接住。
                const nativeBlockRule = /^\\\[([\s\S]+?)\\\]/;
                const nativeInlineRule = /^\\\(([\s\S]+?)\\\)/;
                let match;
                if (match = blockRule.exec(src)) {
                    return { type: 'math', raw: match[0], text: match[1], displayMode: true };
                } else if (match = nativeBlockRule.exec(src)) {
                    // \[ 在 markdown 里本来是"转义的左方括号"，内容是正文时要还回去
                    if (looksLikeProse(match[1])) return false;
                    return { type: 'math', raw: match[0], text: match[1], displayMode: true };
                } else if (match = nativeInlineRule.exec(src)) {
                    if (looksLikeProse(match[1])) return false;
                    return { type: 'math', raw: match[0], text: match[1], displayMode: false };
                } else if (match = inlineRule.exec(src)) {
                    // 放宽空格限制后，普通金额写法（"花了 $5 和 $10"）会被误配成公式。
                    // 判据不能看"内容像不像数字"——$0$、$0.5$、$100$ 在数学文档里全是真公式。
                    // 真正的区别是：金额里的 $ 是孤立的前缀符号，数学公式的 $ 是成对的；
                    // 一旦发生误配对，被夹进这对 $ 里的必然是正文，而不是数学内容。下面两条抓的正是这个。
                    const body = match[1];
                    const rest = src.slice(match[0].length);
                    // ① 花括号之外还夹着中文/全角标点 → 这对 $ 跨过了正文（"$5 和 $"），不是公式
                    if (looksLikeProse(body)) return false;
                    // ② 不含任何 LaTeX 命令，且闭合的 $ 后面紧跟数字 → 那个 $ 其实是下一处金额的起始
                    //    （"spent $5 and $10" 会被配成 "$5 and $"，其后紧跟 10）。含 \cup 这类命令的
                    //    基本可断定是公式，不适用此条，免得误伤 "$\frac{1}{2}$2 倍" 这种写法。
                    if (!/\\[a-zA-Z]/.test(body) && /^\d/.test(rest)) return false;
                    return { type: 'math', raw: match[0], text: match[1], displayMode: false };
                }
                return false;
            },
            renderer(token) {
                const safeText = token.text.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
                if (token.displayMode) {
                    return `<span class="math-display" style="display:block; margin: 1em 0;">\\[${safeText}\\]</span>`;
                } else {
                    return `<span class="math-inline">\\(${safeText}\\)</span>`;
                }
            }
        };

        // $$ 和公式之间隔了空行时，marked 会先按块级把它们切成不同段落，上面那个 inline
        // 扩展就永远配不上对。这里补一个 block 级扩展，在块级切分之前接住。
        // 【刻意收窄】只认"$$ 后面紧跟空行"这一种——那正是 inline 层处理不了的特征。
        // 其余所有写法（$$E=mc^2$$、$$\n公式\n$$、段落中间的 $$）一律不碰，继续走原路径，
        // 免得干扰 marked 的段落切分：block 扩展的 start() 会成为段落的截断点。
        const mathBlockExtension = {
            name: 'mathBlock',
            level: 'block',
            start(src) {
                const m = /(?:^|\n)[ \t]*\$\$[ \t]*\n[ \t]*\n/.exec(src);
                if (!m) return -1;
                return m.index + (m[0][0] === '\n' ? 1 : 0);
            },
            tokenizer(src) {
                const rule = /^\$\$[ \t]*\n(?:[ \t]*\n)+([\s\S]+?)\n(?:[ \t]*\n)*[ \t]*\$\$(?:\n|$)/;
                const match = rule.exec(src);
                if (!match) return false;
                const text = match[1].trim();
                if (!text) return false;
                return { type: 'mathBlock', raw: match[0], text };
            },
            renderer(token) {
                const safeText = token.text.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
                return `<span class="math-display" style="display:block; margin: 1em 0;">\\[${safeText}\\]</span>`;
            }
        };

        // ================= 裸链接在中文标点处截断 =================
        // GFM 规定裸链接一直延伸到空白或 < 为止，中文句子里网址后面没有空格——
        // 「（来源：示例，https://example.com/a.html）。后面一句话。」会把「）。后面一句话。」整段吞进链接
        //（2026-10-07 实测）。跟 markdown-reader / MyKnowledgeBase 同一套规则：在第一个中文/全角标点处截断
        //（汉字本身不截，维基百科、百度百科的词条路径里就是汉字），截完再按 marked 原本的规则去掉末尾英文标点。
        // URL_START_RE / BACKPEDAL_RE 跟 marked@15.0.12 源码里的 inline.url / _backpedal 逐字一致。
        const URL_START_RE = /^((?:ftp|https?):\/\/|www\.)(?:[a-zA-Z0-9\-]+\.?)+[^\s<]*/i;
        const CJK_PUNCT_RE = /[　-〿＀-￯‘’“”…—]/;
        const BACKPEDAL_RE = /(?:[^?!.,:;*_'"~()&]+|\([^)]*\)|&(?![a-zA-Z0-9]+;$)|[?!.,:;*_'"~)]+(?!$))+/;
        const cjkAutolinkTokenizer = {
            url(src) {
                const m = URL_START_RE.exec(src);
                if (!m) return false; // 交还 marked 原本的规则（邮箱自动链接走那里）
                let raw = m[0];
                const cut = raw.search(CJK_PUNCT_RE);
                if (cut !== -1) raw = raw.slice(0, cut);
                let prev;
                do { prev = raw; raw = (BACKPEDAL_RE.exec(raw) || [''])[0]; } while (prev !== raw);
                if (!/^(?:(?:ftp|https?):\/\/|www\.)[a-zA-Z0-9\-]/i.test(raw)) return false;
                // text 给原文、不自己转义：marked 15 的 text 渲染器会转义（预先转义的话 & 会变成 &amp;amp;）
                return { type: 'link', raw, text: raw, href: /^www\./i.test(raw) ? 'http://' + raw : raw, tokens: [{ type: 'text', raw, text: raw }] };
            }
        };

        // ================= 编辑预览的行号标记 =================
        // 光标同步要知道预览里每一块对应源码第几行。原来是渲染完另外 marked.lexer() 一次、按
        // 「第 i 个 token ↔ 第 i 个子元素」打标——HTML 注释（渲染成注释节点不是元素）、链接定义（不出元素）、
        // 一段里并排几个 HTML 标签时这个对应关系都不成立，后面的定位整体错位（2026-10-07 实测：
        // 文档开头有一条注释和一条链接定义，光标在「第25段」预览停在「第26段」）。
        // 现在在 marked.parse 自己的 processAllTokens 钩子里，往每个顶层 token 前插一个空的
        // <div class="kb-block-mark" data-start-line=…>。一块的范围 = 这个标记到下一个标记之间的元素，
        // 渲染出几个元素都不影响对应关系。仍是完整的 marked.parse 流水线，postprocess 里的 DOMPurify 照常生效。
        // 不再单独调 lexer，所以「lexer 不能传第二个参数、否则丢掉 mathBlock 扩展」那个坑也自然没了。
        // 只有编辑预览需要标记，阅读视图不插（markBlocks 开关）。跟 markdown-reader 是同一套算法。
        let markBlocks = false;
        let markSrc = '';
        let markBlocksOut = [];
        const UNMARKED_TYPES = new Set(['space']);
        function annotateBlocks(tokens) {
            if (!markBlocks) return tokens;
            const src = markSrc;
            const original = tokens.slice();
            // 原地改这个数组（tokens.links 等挂在数组对象上的东西要保住）
            tokens.length = 0;
            let from = 0, line = 0, lineOffset = 0;
            const lineAt = (offset) => {
                for (let i = lineOffset; i < offset; i++) if (src.charCodeAt(i) === 10) line++;
                lineOffset = offset;
                return line;
            };
            for (const token of original) {
                const raw = token.raw || '';
                if (UNMARKED_TYPES.has(token.type) || !raw) { tokens.push(token); continue; }
                let idx = src.indexOf(raw, from);
                if (idx === -1) idx = from;
                const startLine = lineAt(idx);
                const endLine = startLine + Math.max(0, raw.replace(/\n+$/, '').split('\n').length - 1);
                const index = markBlocksOut.length;
                markBlocksOut.push({ index, type: token.type, startLine, endLine, offset: idx, token });
                tokens.push({ type: 'html', block: true, pre: false, raw: '', text: `<div class="kb-block-mark" data-block="${index}" data-start-line="${startLine}" data-end-line="${endLine}"></div>\n` });
                tokens.push(token);
                from = idx + raw.length;
            }
            return tokens;
        }

        marked.use(
            { gfm: true, breaks: true },
            markedHighlight({
                langPrefix: 'hljs language-',
                highlight(code, lang) {
                    const language = hljs.getLanguage(lang) ? lang : 'plaintext';
                    return hljs.highlight(code, { language }).value;
                }
            }),
            { extensions: [mathBlockExtension, mathExtension], tokenizer: cjkAutolinkTokenizer },
            // aria-hidden/data-token/data-value 这几个属性在整套代码里都没有实际生成的地方
            // （MathJax 是在这层 sanitize 完成之后，直接对已插入的 DOM 做二次替换渲染的，根本不经过这里），
            // 之前留着的这几个白名单是没验证过的冗余配置，清理掉，跟 markdown-reader 保持一致
            {
                hooks: {
                    preprocess(markdown) { markSrc = String(markdown).replace(/\r\n|\r/g, '\n'); return markdown; },
                    processAllTokens: annotateBlocks,
                    postprocess: (html) => DOMPurify.sanitize(html, { ADD_ATTR: ['style'] })
                }
            }
        );

        mermaid.initialize({ startOnLoad: false, theme: document.body.getAttribute('data-theme') === 'dark' ? 'dark' : 'default' });

        const HLJS_VERSION = '11.9.0';
        const HLJS_LANG_ALIAS = {
            sh: 'bash', zsh: 'bash', ps1: 'powershell', pwsh: 'powershell',
            'c++': 'cpp', cs: 'csharp', kt: 'kotlin', rs: 'rust', tex: 'latex',
            vb: 'vbnet', asm: 'x86asm', proto: 'protobuf', objc: 'objectivec'
        };
        const HLJS_SKIP_LANGS = new Set(['plaintext', 'text', 'mermaid']);
        const hljsLoadAttempted = new Set();

        function loadHljsLanguage(file) {
            if (hljs.getLanguage(file) || hljsLoadAttempted.has(file)) return Promise.resolve();
            hljsLoadAttempted.add(file);
            return new Promise((resolve) => {
                const script = document.createElement('script');
                script.src = `https://cdnjs.cloudflare.com/ajax/libs/highlight.js/${HLJS_VERSION}/languages/${file}.min.js`;
                script.onload = resolve; script.onerror = resolve; 
                document.head.appendChild(script);
            });
        }

        function ensureCodeLanguagesLoaded(markdown) {
            const files = new Set();
            const fenceRe = /^[ \t]*```[ \t]*([A-Za-z0-9_+-]+)/gm;
            let m;
            while ((m = fenceRe.exec(markdown))) {
                const lang = m[1].toLowerCase();
                if (HLJS_SKIP_LANGS.has(lang) || hljs.getLanguage(lang)) continue;
                files.add(HLJS_LANG_ALIAS[lang] || lang);
            }
            return Promise.all([...files].map(loadHljsLanguage));
        }

        // ================= MathJax 按需加载 =================
        // 和上面 hljs 按需加载语言包同一个思路：文档里没有 $ 数学语法就完全不用去拉这个不小的库，
        // 纯文字/代码笔记打开会更快。只在真正遇到公式的文档里才动态插入脚本标签。
        let mathJaxLoadPromise = null;
        function docHasMath(markdown) {
            // 四种定界符都要认。漏掉 \( \[ 会导致：marked 那层已经正确产出了公式 span，
            // 但这里判定"没有数学"→ MathJax 根本不加载 → 公式原样显示，且毫无报错。
            return /\$\$[\s\S]+?\$\$/.test(markdown) || /\$(?:\\.|[^\$\n])+?\$/.test(markdown)
                || /\\\[[\s\S]+?\\\]/.test(markdown) || /\\\([\s\S]+?\\\)/.test(markdown);
        }
        function ensureMathJaxLoaded() {
            if (window.MathJax && window.MathJax.typesetPromise) return Promise.resolve();
            if (mathJaxLoadPromise) return mathJaxLoadPromise;
            mathJaxLoadPromise = new Promise((resolve) => {
                const script = document.createElement('script');
                script.id = 'MathJax-script';
                script.src = 'https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js';
                script.onload = () => {
                    if (window.MathJax && window.MathJax.startup && window.MathJax.startup.promise) {
                        window.MathJax.startup.promise.then(resolve);
                    } else resolve();
                };
                script.onerror = resolve; // 加载失败就放弃渲染，公式退化显示为原始 \(...\) 文本
                document.head.appendChild(script);
            });
            return mathJaxLoadPromise;
        }

        function stripFrontMatter(text) {
            const match = text.match(/^---\r?\n[\s\S]*?\r?\n(?:---|\.\.\.)\r?\n?/);
            return match ? text.slice(match[0].length) : text;
        }

        function slugify(text, usedSlugs) {
            let slug = String(text).trim().toLowerCase()
                .replace(/[!"#%&'()*+,./:;<=>?@[\]^`{|}~]/g, '')
                .replace(/\s+/g, '-');
            if (!slug) slug = 'section';
            let unique = slug, i = 1;
            while (usedSlugs.has(unique)) unique = `${slug}-${i++}`;
            usedSlugs.add(unique);
            return unique;
        }

        let currentState = 'home';
        let currentFile = null;
        let originalContent = '';
        let sortOrder = localStorage.getItem('md-pro-sort') || 'desc';
        
        const defaultDB = { folders: [{ id: 'root', name: '默认文件夹', isOpen: true }], files: [] };

        // 拼进 innerHTML 的文件名/文件夹名一律先转义：文件名来自用户本机任意 .md
        //（macOS / 安卓 / Linux 的文件名可以带 < >），形如 <img src=x onerror=…>.md 的文件名
        // 原来在侧边栏和操作菜单里会被当成 HTML 执行（2026-10-07 实测执行 2 次）。
        function escapeHtml(s) {
            return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
        }

        function getDB() {
            let rawStr = localStorage.getItem('md-pro-db');
            if (!rawStr) return JSON.parse(JSON.stringify(defaultDB));
            try {
                let parsed = JSON.parse(rawStr);
                if (Array.isArray(parsed)) {
                    let migratedDB = JSON.parse(JSON.stringify(defaultDB));
                    parsed.forEach(f => { f.folderId = 'root'; migratedDB.files.push(f); });
                    localStorage.setItem('md-pro-db', JSON.stringify(migratedDB));
                    return migratedDB;
                }
                return parsed;
            } catch (e) {
                // 存的数据解析不了时，原来直接返回空库——下一次任何保存都会把它写回去，所有文档就此消失。
                // 先把原文另存一份，再提示用户，至少还有得救。
                try {
                    if (!localStorage.getItem('md-pro-db-corrupt-backup')) localStorage.setItem('md-pro-db-corrupt-backup', rawStr);
                } catch (_) {}
                if (!getDB.warned) {
                    getDB.warned = true;
                    setTimeout(() => alert('本地保存的文档数据损坏，读不出来。原始数据已另存到 localStorage 的 md-pro-db-corrupt-backup，请先别清除浏览器数据。'), 0);
                }
                return JSON.parse(JSON.stringify(defaultDB));
            }
        }

        // 返回是否真的存上了。localStorage 一般只有 5MB 左右，存满时 setItem 会抛异常，原来没接住：
        // 点「保存」界面停在编辑页、毫无提示，像点了没反应，用户以为存好了关掉页面，改动就没了。
        function saveDB(db) {
            try {
                localStorage.setItem('md-pro-db', JSON.stringify(db));
            } catch (e) {
                alert('保存失败：浏览器本地存储空间已满（或被禁用）。\n这次的修改还在编辑框里，请先复制出来，再删掉一些不用的文档后重试。');
                return false;
            }
            renderDrawer();
            return true;
        }

        const vHome = document.getElementById('view-home');
        const vRead = document.getElementById('view-read');
        const vEdit = document.getElementById('view-edit');
        
        const headerUI = {
            btnHamburger: document.getElementById('btn-hamburger'), btnBack: document.getElementById('btn-back'),
            btnTheme: document.getElementById('btn-theme'), btnHomeSample: document.getElementById('btn-home-sample'),
            btnReadCopy: document.getElementById('btn-read-copy'), btnReadEdit: document.getElementById('btn-read-edit'),
            btnReadMore: document.getElementById('btn-read-more'), btnEditSave: document.getElementById('btn-edit-save'),
            btnEditCancel: document.getElementById('btn-edit-cancel'), btnEditReset: document.getElementById('btn-edit-reset'),
            btnEditMore: document.getElementById('btn-edit-more'), 
            headerLogo: document.getElementById('header-logo'), headerTitle: document.getElementById('header-title')
        };
        const overlay = document.getElementById('overlay'); const drawer = document.getElementById('drawer');
        const actionMenu = document.getElementById('action-menu'); const actionMenuItems = document.getElementById('action-menu-items');
        const actionMenuOverlay = document.getElementById('action-menu-overlay');
        const titleTooltip = document.getElementById('title-tooltip');
        
        const tocSidebar = document.getElementById('toc-sidebar'); const tocContent = document.getElementById('toc-content');
        const btnFabToc = document.getElementById('btn-fab-toc'); const tocOverlay = document.getElementById('toc-overlay');
        const readerContent = document.getElementById('reader-content'); const editorTextarea = document.getElementById('editor-textarea');
        const editorPreview = document.getElementById('editor-preview');
        const btnSort = document.getElementById('btn-sort');

        // 顶栏按钮、悬浮目录按钮、目录侧栏这些「外壳」：只跟当前状态和屏幕宽度有关，跟内容无关。
        // 单独拆出来，是因为窗口宽度跨过 768 断点时只该刷新外壳（见下面的 resize 监听）。
        function applyChrome(state) {
            const isMobile = window.innerWidth < 768;
            btnFabToc.classList.add('hidden');
            Object.values(headerUI).forEach(el => { if(el && el.id !== 'btn-hamburger') el.classList.add('hidden'); });
            if (state === 'home') {
                headerUI.headerLogo.classList.remove('hidden');
                headerUI.btnHomeSample.classList.remove('hidden'); headerUI.btnTheme.classList.remove('hidden');
                tocSidebar.classList.add('collapsed');
            } else if (state === 'read') {
                headerUI.btnBack.classList.remove('hidden');
                headerUI.headerTitle.classList.remove('hidden'); headerUI.headerTitle.innerText = currentFile.title;
                if(isMobile) {
                    headerUI.btnReadMore.classList.remove('hidden'); btnFabToc.classList.remove('hidden');
                } else {
                    headerUI.btnReadCopy.classList.remove('hidden'); headerUI.btnReadEdit.classList.remove('hidden'); headerUI.btnTheme.classList.remove('hidden');
                    tocSidebar.classList.remove('collapsed');
                }
            } else if (state === 'edit') {
                headerUI.headerTitle.classList.remove('hidden'); headerUI.headerTitle.innerText = "编辑: " + currentFile.title;
                if(isMobile) {
                    headerUI.btnBack.classList.remove('hidden'); headerUI.btnEditMore.classList.remove('hidden');
                } else {
                    headerUI.btnEditCancel.classList.remove('hidden'); headerUI.btnEditReset.classList.remove('hidden');
                    headerUI.btnEditSave.classList.remove('hidden'); headerUI.btnTheme.classList.remove('hidden');
                }
                tocSidebar.classList.add('collapsed');
            }
        }

        async function switchState(newState) {
            currentState = newState;
            vHome.classList.add('hidden'); vRead.classList.add('hidden'); vEdit.classList.add('hidden');
            ({ home: vHome, read: vRead, edit: vEdit })[newState].classList.remove('hidden');
            applyChrome(newState);
            if (newState === 'read') {
                if (await renderMarkdown(currentFile.content, readerContent)) generateTOC();
            } else if (newState === 'edit') {
                originalContent = currentFile.content;
                editorTextarea.value = currentFile.content; await renderMarkdown(currentFile.content, editorPreview);
            }
        }

        function showActionMenu(items) {
            actionMenuItems.innerHTML = '';
            items.forEach(item => {
                const div = document.createElement('div');
                div.className = `action-item ${item.danger ? 'danger' : ''} ${item.success ? 'success' : ''} ${item.isTitle ? 'title' : ''}`;
                // text 里可能拼着文件名/文件夹名，一律转义；icon 是代码里写死的类名
                div.innerHTML = item.isTitle ? escapeHtml(item.text) : `<i class="${item.icon}"></i> ${escapeHtml(item.text)}`;
                if (!item.isTitle) { div.onclick = () => { closeActionMenu(); item.action(); }; }
                actionMenuItems.appendChild(div);
            });
            actionMenuOverlay.style.display = 'block'; setTimeout(() => { actionMenuOverlay.style.opacity = '1'; }, 10);
            actionMenu.classList.add('show');
        }

        function closeActionMenu() { actionMenuOverlay.style.opacity = '0'; actionMenu.classList.remove('show'); setTimeout(() => { actionMenuOverlay.style.display = 'none'; }, 300); }
        actionMenuOverlay.onclick = closeActionMenu;

        btnSort.innerHTML = sortOrder === 'desc' ? '<i class="fas fa-sort-amount-down"></i>' : '<i class="fas fa-sort-amount-up"></i>';
        btnSort.onclick = () => {
            sortOrder = sortOrder === 'desc' ? 'asc' : 'desc'; localStorage.setItem('md-pro-sort', sortOrder);
            btnSort.innerHTML = sortOrder === 'desc' ? '<i class="fas fa-sort-amount-down"></i>' : '<i class="fas fa-sort-amount-up"></i>'; renderDrawer();
        };

        function renderDrawer() {
            let db = getDB();

        // 返回 false 表示这次渲染已经被更新的一次取代、中途放弃了

            markBlocksOut = [];

            try { html = marked.parse(body); } finally { markBlocks = false; }

            if (isPreview) tagBlockDetails(target, blocks, markSrc);

        // 一个行号标记管辖的元素：从它后面一个开始，到下一个标记为止
        function blockElements(mark) {

        function tagBlockDetails(target, blocks, src) {
            // 按 raw 在源码里的出现位置定位每个列表项。cursor 必须严格随文档顺序推进——否则内容完全相同
            // 的两行（题目整理这类高度重复的文档里很常见）会被一起匹配到最前面那一处。
            function tagList(items, listEl, listOffset) {
                let cursor = listOffset;
                items.forEach((item, j) => {
                    const raw = item.raw || '';
                    let idx = raw ? src.indexOf(raw, cursor) : cursor;
                    if (idx === -1) idx = cursor;

                    if (li && li.tagName === 'LI') {

                            if (nestedEls[k] && Array.isArray(nt.items)) tagList(nt.items, nestedEls[k], idx);

            }
            // GFM 表格源码结构固定：第1行表头、第2行分隔线、之后每行一条数据，行号直接推算
            function tagTable(tableEl, startLine) {
                const headRow = tableEl.querySelector('thead tr');
                if (headRow) headRow.dataset.startLine = startLine;
                tableEl.querySelectorAll('tbody tr').forEach((tr, i) => { tr.dataset.startLine = startLine + 2 + i; });
            }

        // 源码第 line 行 → 预览里的定位点（整块、列表项或表格行）。文档顺序下起始行号单调不减，
        // 所以"取最后一个 <= 光标行"可以遇到更大的就 break。渲染不出元素的块（链接定义、HTML 注释）
        // 没有位置可去，跳过，落到前一个点上。
        function locatePreviewLine(container, line) {
            let hit = null;
            for (const point of container.querySelectorAll('[data-start-line]')) {
                if (Number(point.dataset.startLine) > line) break;

            }
            return { top, height, startLine: Number(hit.dataset.startLine), endLine: Number(hit.dataset.endLine), flash };
        }

            if (!els || !els.length) return;
            void els[0].offsetWidth; // 强制回流，让重新加上 class 能重播动画
            els.forEach(el => el.classList.add('sync-highlight'));
            setTimeout(() => els.forEach(el => el.classList.remove('sync-highlight')), 900);
        }

        function scrollPreviewToCursor() {
            const value = editorTextarea.value;
            // 预览渲染的是去掉 YAML front matter 之后的正文（stripFrontMatter），行号按正文算；光标行号却是按
            // 整个编辑框算的。原来没扣掉这一段，带 front matter 的文档光标同步整体错开头部那几行
            //（2026-10-07 实测：光标在「第25段」预览停在「第27段」）。
            const fmLength = value.length - stripFrontMatter(value).length;
            const fmLines = (value.slice(0, fmLength).match(/\n/g) || []).length;
            const cursorLine = (value.slice(0, editorTextarea.selectionStart).match(/\n/g) || []).length - fmLines;
            const hit = locatePreviewLine(editorPreview, cursorLine);
            if (!hit) return;
            // 不用 scrollIntoView({block:'center'})：它会连带滚动所有可滚动祖先，目标比可视区高时"居中"会把开头顶出屏幕，
            // 而且光标那一行应当顶到最上面。直接算 .preview-pane（真正带 overflow-y:auto 的那层）该滚多少。
            const TOP_GAP = 12;
            const pane = editorPreview.closest('.preview-pane') || editorPreview.parentElement;
            if (!pane) return;
            const paneRect = pane.getBoundingClientRect();
            // 目标比可视区还高时（长代码块这种块内没有更细元素可选的情况），按"光标在这块的第几行"在块内插值
            let anchorTop = hit.top;
            if (hit.height >= paneRect.height) {
                const span = Number.isFinite(hit.endLine) && hit.endLine > hit.startLine ? hit.endLine - hit.startLine : 0;
                const ratio = span > 0 ? Math.min(1, Math.max(0, (cursorLine - hit.startLine) / span)) : 0;
                anchorTop = hit.top + ratio * hit.height;
            }
            pane.scrollTop += anchorTop - paneRect.top - TOP_GAP;
            flashHighlight(hit.flash);
        }

        const CURSOR_MOVE_KEYS = new Set(['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Home', 'End', 'PageUp', 'PageDown']);
        editorTextarea.addEventListener('click', scrollPreviewToCursor);
        editorTextarea.addEventListener('keyup', e => { if (CURSOR_MOVE_KEYS.has(e.key)) scrollPreviewToCursor(); });
        // renderMarkdown 内部 await 了 MathJax 排版，所以 await 之后再定位，量到的才是排版后的最终位置；
        // 只有没被后来的渲染取代的那一次才去定位，免得旧的那次跑完把预览滚回旧位置
        editorTextarea.addEventListener('input', async e => { if (await renderMarkdown(e.target.value, editorPreview)) scrollPreviewToCursor(); });
        document.getElementById('menu-new').onclick = () => { const title = prompt("新文档名称：", "未命名文档"); if (title) { currentFile = { id: Date.now().toString(), title, content: `# ${title}\n\n` }; saveToCurrentFolder(currentFile); closeDrawer(); switchState('edit'); } };
        
        // 示例按钮：可以直接验证你截图里的公式了！
        headerUI.btnHomeSample.onclick = () => { 
            currentFile = { id: 'sample', title: '示例：概率公式测试', content: '这是一些概率论公式的测试：\n\n1. 单选选项：则 $P\\{X^2 = 1\\} = $ （B）\n2. 分布函数：则 $P\\{X \\leq 2\\} = $ （B）\n3. 二维分布：则 $P\\{6 < X \\leq 8, 5 < Y \\leq 10\\} = $ ( A )' }; 
            saveToCurrentFolder(currentFile); 
            switchState('read'); 
        };
        
        function toggleTheme() { setTheme(document.body.getAttribute('data-theme') !== 'dark'); }
        headerUI.btnTheme.onclick = toggleTheme;
        // 原来是 window.onresize = () => switchState(currentState)：每次窗口尺寸变化都整个重走一遍状态切换——
        // 编辑状态下会把编辑框重置成 currentFile.content，没保存的修改全部丢失（2026-10-07 实测；
        // 手机转屏、电脑拖窗口大小都会触发）；阅读状态下也是每一帧都把整篇连同 MathJax 重新排版一遍。
        // 真正需要随宽度变的只有顶栏按钮和目录栏，而且只在跨过 768 断点时才变。
        let lastIsMobile = window.innerWidth < 768;
        window.addEventListener('resize', () => {
            const isMobile = window.innerWidth < 768;
            if (isMobile === lastIsMobile) return;
            lastIsMobile = isMobile;
            applyChrome(currentState);
        });

        function setTheme(isDark) {
            document.body.setAttribute('data-theme', isDark ? 'dark' : 'light'); headerUI.btnTheme.innerHTML = isDark ? '<i class="fas fa-sun"></i>' : '<i class="fas fa-moon"></i>';
            localStorage.setItem('md-theme', isDark ? 'dark' : 'light'); document.getElementById('md-style').href = `https://cdnjs.cloudflare.com/ajax/libs/github-markdown-css/5.5.0/github-markdown-${isDark ? 'dark' : 'light'}.min.css`;
            document.getElementById('hljs-style').href = `https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/${isDark ? 'github-dark' : 'github'}.min.css`;
            rerenderMermaid();
        }
        // 切换深色/浅色后，已经画好的 Mermaid 图要按新主题重画（renderMarkdown 画图时把源码记在 data-source 上）
        function rerenderMermaid() {
            const graphs = Array.from(document.querySelectorAll('.mermaid[data-source]'));
            if (!graphs.length) return;
            graphs.forEach(g => { g.removeAttribute('data-processed'); g.textContent = g.dataset.source; });
            mermaid.initialize({ startOnLoad: false, theme: document.body.getAttribute('data-theme') === 'dark' ? 'dark' : 'default' });
            mermaid.run({ nodes: graphs }).catch(err => console.error('Mermaid 重画失败:', err));
        }
        const savedTheme = localStorage.getItem('md-theme'); setTheme(savedTheme === 'dark' || (!savedTheme && window.matchMedia('(prefers-color-scheme: dark)').matches));
        
        renderDrawer(); switchState('home');
    </script>
</body>
</html>
